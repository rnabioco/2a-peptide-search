# Configuration for prokaryotic 2A-like discovery pipeline

# Prokaryotic protein databases
prokaryotic_databases:
  bacteria:
    url: "https://rest.uniprot.org/uniprotkb/stream?compressed=true&format=fasta&query=%28taxonomy_id%3A2%29+AND+%28reviewed%3Atrue%29"
    description: "UniProt Swiss-Prot bacterial proteins (via REST API)"

  archaea:
    url: "https://rest.uniprot.org/uniprotkb/stream?compressed=true&format=fasta&query=%28taxonomy_id%3A2157%29+AND+%28reviewed%3Atrue%29"
    description: "UniProt Swiss-Prot archaeal proteins (via REST API)"

  mgnify:
    # MGnify uses the merged database from the main pipeline
    # Download via main pipeline first: pixi run snakemake download_mgnify --cores 4
    local_path: ""  # Will be set to DATA_DIR/mgnify/mgnify_proteins.fasta.gz if downloaded
    description: "MGnify metagenomic protein database (use main pipeline download)"

  imgvr:
    local_path: "/scratch/alpine/jhesselberth@xsede.org/db/IMGVR_all_proteins-high_confidence.faa.gz"
    description: "IMG/VR phage protein database (local copy)"

  pfam:
    url: "http://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz"
    description: "Pfam domain database"

# Phage genome databases
phage_databases:
  inphared:
    genomes_url: "https://millardlab-inphared.s3.climb.ac.uk/22Aug2023_genomes.fas"
    metadata_url: "https://millardlab-inphared.s3.climb.ac.uk/22Aug2023_data.tsv"
    description: "INPHARED curated phage database"

  imgvr:
    # IMG/VR requires web login - download manually and specify local path
    # Download from: https://img.jgi.doe.gov/vr/
    # Set local_path to your downloaded file location
    local_path: /scratch/alpine/jhesselberth@xsede.org/db/IMGVR_all_proteins-high_confidence.faa.gz # e.g., "/path/to/IMGVR_all_nucleotides.fna.gz"
    url: "https://img.jgi.doe.gov/vr/IMGVR_all_nucleotides.fna.gz"  # Fallback (requires login)
    description: "IMG/VR phage and virus database (requires manual download)"

  millardlab:
    url: "https://millardlab.org/phage-genomes/phage_genomes.fasta.gz"
    description: "Millard Lab phage genome collection"

# Which protein databases to search
prokaryotic_databases_to_search:
  - bacteria   # UniProt bacteria (~500k proteins)
  - archaea    # UniProt archaea (~50k proteins)
  - imgvr      # IMG/VR phage proteins (millions, local file)
  # - mgnify   # MGnify metagenomic proteins (VERY large, ~300M proteins, enable for comprehensive search)

# Which phage databases to use
phage_databases_to_use:
  - inphared
  - imgvr  # Very large, enable for comprehensive search
  - millardlab

# Prokaryotic analysis parameters
prokaryotic:
  # GP motif extraction
  gp_upstream: 30      # Residues upstream of GP
  gp_downstream: 15    # Residues downstream of GP

  # Clustering parameters
  clustering_identity: 0.7    # Sequence identity for clustering (70%)
  clustering_coverage: 0.8     # Coverage threshold (80%)

  # Filtering parameters
  min_cluster_size: 5          # Minimum sequences per cluster
  min_conservation: 0.6        # Minimum conservation score

  # Known stalling peptides for validation
  known_peptides:
    SecM:
      sequence: "FSTPVWISQAQGIRAGP"
      organism: "E. coli"
      function: "Secretion monitor"

    TnaC:
      sequence: "WDPXXXIGP"  # Consensus pattern
      organism: "E. coli"
      function: "Tryptophanase leader"

    MifM:
      sequence: "XXXGPXXGIAGP"
      organism: "Bacillus subtilis"
      function: "Membrane protein insertion"

    CydA:
      sequence: "RAGP"
      organism: "E. coli"
      function: "Cytochrome bd oxidase"

  # Inter-domain linker parameters
  linker:
    min_length: 5        # Minimum linker length
    max_length: 50       # Maximum linker length to consider

# ORF prediction parameters
orf_prediction:
  tool: "prodigal"       # ORF prediction tool
  mode: "meta"           # Metagenomics mode for diverse phages
  min_gene_length: 60    # Minimum ORF length (20 amino acids)
  translation_table: 11  # Standard bacterial code

# Domain annotation parameters
domain_annotation:
  tool: "hmmscan"        # Use HMMER hmmscan
  pfam_cutoff: "gathering"  # Use Pfam gathering cutoffs
  evalue: 1e-3          # E-value threshold

# Analysis parameters
analysis:
  # Motif pattern matching
  patterns:
    - "RAGP"      # Classic prokaryotic stalling
    - "[RK]AGP"   # R/K-AGP
    - "[RK][AG]GP" # R/K-A/G-GP
    - "NPGP"      # Eukaryotic-like
    - "HPGP"      # Eukaryotic-like

  # Position analysis
  position_bins:
    - [0, 50]       # N-terminal
    - [50, 150]     # Early
    - [150, -150]   # Middle
    - [-150, -50]   # Late
    - [-50, 0]      # C-terminal
