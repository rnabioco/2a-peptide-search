# Configuration for 2A peptide search pipeline

# Protein databases to search
databases:
  uniprot:
    url: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot.fasta.gz"
    description: "UniProt Swiss-Prot - curated protein sequences"
    size: "small"  # ~500k sequences

  reference_proteomes:
    url: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/reference_proteomes/Reference_Proteomes_2024_02.tar.gz"
    description: "Reference proteomes used by Pfam"
    size: "medium"  # representative proteomes

  uniparc:
    url: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/uniparc/uniparc_active.fasta.gz"
    description: "UniParc - non-redundant archive"
    size: "very_large"  # millions of sequences

  mgnify:
    url: "https://ftp.ebi.ac.uk/pub/databases/metagenomics/peptide_database/current_release/mgnify_proteins.fasta.gz"
    description: "MGnify environmental/metagenomic sequences"
    size: "very_large"

# Which databases to search (comment out to skip)
databases_to_search:
  - uniprot
  - reference_proteomes
  # - uniparc  # Warning: very large, takes long time
  # - mgnify   # Warning: very large, takes long time

# Search and filtering thresholds
thresholds:
  evalue: 1e-5           # E-value threshold for including hits
  identity: 0.95         # Sequence identity threshold for redundancy filtering
  min_coverage: 0.8      # Minimum alignment coverage

# Iteration parameters
iterations:
  iter1:
    automated: true
    description: "First automated refinement"
  iter2:
    automated: true
    checkpoint: true
    description: "Second refinement with manual checkpoint"
  final:
    checkpoint: true
    description: "Final curated models"

# Peptide classes
peptide_classes:
  - class-1
  - class-2

# Resource allocation
resources:
  hmmsearch_threads: 12
  download_retries: 3
