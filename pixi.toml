[workspace]
name = "2a-peptide-search"
version = "0.1.0"
description = "Bioinformatics pipeline for identifying 2A peptides using profile HMMs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tasks]
# Run full pipeline
run = "snakemake --use-conda --cores 12"
# Dry run to preview execution
dry-run = "snakemake -n"
# Test with UniProt only
test = "snakemake test --use-conda --cores 12"
# Download databases
download = "snakemake download_all --use-conda --cores 4"
# Build seed models
build-seeds = "snakemake build_seeds --use-conda"
# Generate workflow visualization
dag = "snakemake --dag | dot -Tpng > workflow.png"

[dependencies]
# Core Snakemake and workflow management
# Snakemake will manage tool-specific conda envs with --use-conda
snakemake = ">=9.0"
python = "3.12.*"
snakemake-executor-plugin-slurm = "*"

[feature.dev.dependencies]
# Development tools for linting, formatting, etc.
ruff = "*"

[environments]
# Default environment with just Snakemake
default = { solve-group = "default" }
# Development environment with additional tools
dev = { features = ["dev"], solve-group = "default" }
