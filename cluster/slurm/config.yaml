# Snakemake SLURM Profile - 2A Peptide Search Pipeline
# =====================================================
# Alpine cluster configuration
# Usage: snakemake --profile cluster/slurm

executor: slurm
jobs: 100
max-jobs-per-second: 10
latency-wait: 60
restart-times: 2
rerun-incomplete: true
keep-going: true
printshellcmds: true

# Job naming - use rule name and wildcards for readable job names
jobname: "2a-{rule}-{wildcards}-{jobid}"

# Default resources for all jobs
default-resources:
  slurm_partition: amilan
  slurm_account: amc-general  # CHANGE THIS to your Alpine allocation
  ntasks: 1
  runtime: 120  # minutes
  mem_mb: 8000
  cpus_per_task: 4

# SLURM QoS setting
slurm-qos: normal

# Rule-specific resources
set-resources:
  # ============================================================================
  # Database Download Rules
  # ============================================================================
  download_uniprot:
    runtime: 60
    mem_mb: 2000
    cpus_per_task: 1

  download_reference_proteomes:
    runtime: 120
    mem_mb: 2000
    cpus_per_task: 1

  extract_reference_proteomes:
    runtime: 60
    mem_mb: 8000
    cpus_per_task: 4

  download_uniparc:
    runtime: 480  # 8 hours - very large file
    mem_mb: 4000
    cpus_per_task: 1

  download_mgnify:
    runtime: 480  # 8 hours - very large file
    mem_mb: 4000
    cpus_per_task: 1

  # ============================================================================
  # HMM Building Rules
  # ============================================================================
  build_seed_models:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  build_refined_model:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 1

  build_final_models:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 1

  # ============================================================================
  # HMM Search Rules (resource intensive)
  # ============================================================================
  hmmsearch:
    runtime: 1440  # 24 hours max for large databases
    mem_mb: 16000
    cpus_per_task: 12

  # ============================================================================
  # Alignment Processing Rules
  # ============================================================================
  filter_alignment:
    runtime: 30
    mem_mb: 8000
    cpus_per_task: 2

  merge_database_alignments:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # ============================================================================
  # Reporting Rules
  # ============================================================================
  collect_statistics:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 2

  generate_report:
    runtime: 60
    mem_mb: 8000
    cpus_per_task: 4

  # ============================================================================
  # Sequence Logo Generation Rules
  # ============================================================================
  generate_logo_seed:
    runtime: 10  # API calls with retries
    mem_mb: 2000
    cpus_per_task: 1

  generate_logo_iter1:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  generate_logo_iter2:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  generate_logo_final:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1
